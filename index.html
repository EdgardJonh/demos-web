<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Demos Web · Edgard Carrión</title>
    <meta name="description" content="Diseños web para clientes. Selecciona un proyecto para ver la demo." />
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0e110f;
        --surface: #151a16;
        --line: rgba(244, 241, 234, 0.12);
        --text: #f4f1ea;
        --muted: rgba(244, 241, 234, 0.66);
        --accent: #f2b705;
        --radius: 16px;
        --gutter: clamp(16px, 4vw, 48px);
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, system-ui, sans-serif;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }
      a { color: inherit; text-decoration: none; }
      .wrap { max-width: 1280px; margin: 0 auto; padding: 0 var(--gutter); }
      header {
        display: flex; align-items: center; justify-content: space-between;
        padding-block: 28px; border-bottom: 1px solid var(--line);
      }
      .brand {
        font-family: Oswald, sans-serif; font-weight: 600; letter-spacing: 0.14em;
        text-transform: uppercase; font-size: 18px;
      }
      .brand span { color: var(--accent); }
      header small { color: var(--muted); font-size: 13px; }
      .intro { padding-block: clamp(56px, 9vw, 120px) clamp(40px, 6vw, 72px); }
      .eyebrow { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; margin: 0 0 16px; }
      .eyebrow::before { content: ""; width: 26px; height: 2px; background: var(--accent); }
      h1 {
        font-family: Oswald, sans-serif; font-weight: 600; text-transform: uppercase;
        font-size: clamp(44px, 8vw, 112px); line-height: 0.95; margin: 0 0 20px;
      }
      .intro p { color: var(--muted); max-width: 52ch; margin: 0; font-size: clamp(15px, 1.3vw, 18px); }
      .grid {
        display: grid; gap: clamp(14px, 1.6vw, 22px);
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr));
        padding-bottom: clamp(64px, 9vw, 120px);
      }
      .card {
        position: relative; display: block; aspect-ratio: 4 / 3.2; border-radius: var(--radius);
        overflow: hidden; background: var(--surface); box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
        transition: transform 0.5s var(--ease);
      }
      .card img {
        position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
        transition: transform 0.9s var(--ease);
      }
      .card::after {
        content: ""; position: absolute; inset: 0;
        background: linear-gradient(0deg, rgba(0, 0, 0, 0.82) 0%, rgba(0, 0, 0, 0) 60%);
      }
      .card:hover { transform: translateY(-6px); }
      .card:hover img { transform: scale(1.05); }
      .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
      .num {
        position: absolute; z-index: 1; top: 16px; right: 18px;
        font-family: Oswald, sans-serif; font-size: 22px;
      }
      .info { position: absolute; z-index: 1; left: 22px; right: 22px; bottom: 20px; }
      .info small { color: var(--muted); font-size: 12px; letter-spacing: 0.04em; }
      .info h2 {
        font-family: Oswald, sans-serif; font-weight: 600; text-transform: uppercase;
        font-size: clamp(24px, 2.4vw, 32px); line-height: 1.05; margin: 4px 0 10px;
      }
      .info span { color: var(--accent); font-weight: 600; font-size: 14px; }
      footer { border-top: 1px solid var(--line); padding-block: 24px; color: var(--muted); font-size: 13px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <a href="./" class="brand">Demos<span>·</span>Web</a>
        <small>Edgard Carrión</small>
      </header>

      <section class="intro">
        <p class="eyebrow">Portafolio de diseños</p>
        <h1>Demos web</h1>
        <p>Propuestas de diseño para clientes. Selecciona un proyecto para ver la demo funcionando.</p>
      </section>

      <main class="grid" id="grid"></main>
    </div>
    <footer><div class="wrap">© <span id="y"></span> · Demos con fines de presentación.</div></footer>

    <script>
      // ▼ Agrega aquí cada nuevo diseño publicado
      const projects = [
        {
          folder: "agromaq",
          name: "AgroMaq",
          type: "Servicio agrícola de maquinarias",
          image: "https://images.unsplash.com/photo-1635174815612-fd9636f70146?auto=format&fit=crop&w=900&q=70",
        },
      ];

      const grid = document.getElementById("grid");
      projects.forEach((p, i) => {
        const a = document.createElement("a");
        a.className = "card";
        a.href = `./${p.folder}/`;
        a.innerHTML = `
          <img src="${p.image}" alt="" loading="lazy" />
          <span class="num">${String(i + 1).padStart(2, "0")}</span>
          <div class="info">
            <small>${p.type}</small>
            <h2>${p.name}</h2>
            <span>Ver demo →</span>
          </div>`;
        grid.appendChild(a);
      });
      document.getElementById("y").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
